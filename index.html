<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Supabase JS Client CDN -->

</head>
<body class="bg-brand-bg text-brand-primary min-h-screen font-sans pb-24">

    <!-- Top Navigation Header -->
    <header class="bg-brand-primary text-white py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide text-brand-gold">Estates Reseller App</h1>
            <span id="syncStatus" class="text-xs bg-emerald-700 px-3 py-1 rounded-full flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synced
            </span>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Active Sales List -->
        <section id="salesView" class="block">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Active Sourcing Trips</h2>
                <button onclick="showCreateSaleModal()" class="bg-brand-gold text-white px-4 py-2 rounded-md font-semibold text-sm hover:opacity-90">
                    + Add New Sale
                </button>
            </div>
            <div id="estatesList" class="grid gap-4 md:grid-cols-2">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- Selected Sale / Lot Detail View -->
        <section id="lotView" class="hidden">
            <!-- Back Button -->
            <button onclick="showSalesView()" class="text-brand-gold font-semibold mb-4 flex items-center gap-2 hover:underline">
                ← Back to Trips
            </button>

            <div id="saleHeader" class="mb-6">
                <!-- Dynamically loaded heading -->
            </div>

            <!-- Add Lot Form -->
            <div class="bg-white p-6 rounded-lg border border-gray-200 mb-6 shadow-sm">
                <h3 class="text-md font-bold mb-4 text-brand-primary">Add Lot Reference Screenshot</h3>
                <input type="text" id="newLotTitle" placeholder="e.g. Lot 1 - Miniature Clocks Table" class="w-full p-2 border rounded-md mb-4 focus:ring-1 focus:ring-brand-gold focus:outline-none">
                <div class="border-2 border-dashed border-brand-gold rounded-lg p-6 text-center mb-4 cursor-pointer hover:bg-gray-50" onclick="document.getElementById('lotImageFile').click()">
                    <span class="text-sm font-medium text-brand-primary" id="uploadLabel">📷 UPLOAD REFERENCE SCREENSHOT</span>
                    <input type="file" id="lotImageFile" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
                </div>
                <button onclick="createLot()" class="w-full bg-brand-primary text-white py-2 rounded-md font-bold text-sm hover:bg-black transition-colors">
                    Save Lot Reference
                </button>
            </div>

            <!-- Dynamic Lot Grid -->
            <div id="lotsList" class="space-y-8">
                <!-- Dynamically rendered lots and matching item cards -->
            </div>
        </section>

    </main>

    <!-- Create Sale Modal -->
    <div id="createSaleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full">
            <h3 class="text-lg font-bold mb-4">Add Sourcing Trip</h3>
            <label class="block text-xs font-semibold uppercase mb-1">Sale Name</label>
            <input type="text" id="estateName" placeholder="e.g. Archeology Estates" class="w-full p-2 border rounded-md mb-4 focus:ring-1 focus:ring-brand-gold focus:outline-none">

            <label class="block text-xs font-semibold uppercase mb-1">Company/Seller</label>
            <input type="text" id="estateSeller" placeholder="e.g. Archeology Estates Co." class="w-full p-2 border rounded-md mb-4 focus:ring-1 focus:ring-brand-gold focus:outline-none">

            <label class="block text-xs font-semibold uppercase mb-1">Date</label>
            <input type="date" id="estateDate" class="w-full p-2 border rounded-md mb-6 focus:ring-1 focus:ring-brand-gold focus:outline-none">

            <div class="flex gap-2">
                <button onclick="hideCreateSaleModal()" class="flex-1 border py-2 rounded-md font-semibold text-sm hover:bg-gray-50">Cancel</button>
                <button onclick="createEstate()" class="flex-1 bg-brand-gold text-white py-2 rounded-md font-semibold text-sm hover:opacity-90">Create Trip</button>
            </div>
        </div>
    </div>

    <!-- Scripting Magic: Sync, Caching, & Paste Parsing -->
    <script>
        let currentEstateId = null;
        let selectedFile = null;
           const collapsedNotesState = {};

        // On Load: Read data from cache first, then sync from Supabase
        window.addEventListener('DOMContentLoaded', async () => {
            loadFromLocalStorage();
            await fetchEstates();
            setupRealtimeSubscriptions();
        });

        // Offline Caching Framework (Basement Trip Protection!)
        function saveToLocalStorage(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const cachedEstates = localStorage.getItem('estates');
            if (cachedEstates) {
                renderEstates(JSON.parse(cachedEstates));
            }
        }

        // Real-Time Listening Engine
        function setupRealtimeSubscriptions() {
            supabase
                .channel('realtime-sourcing')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, async () => {
                    if (currentEstateId) await loadLots(currentEstateId);
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'estates' }, async () => {
                    await fetchEstates();
                })
                .subscribe();
        }

        // CRUD Database Queries
        async function fetchEstates() {
            const { data, error } = await supabase
                .from('estates')
                .select('*')
                .order('sale_date', { ascending: false });

            if (error) {
                console.error("Sync Error: ", error);
                document.getElementById('syncStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Offline/Error';
            } else {
                saveToLocalStorage('estates', data);
                renderEstates(data);
                document.getElementById('syncStatus').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synced';
            }
        }

        function renderEstates(estates) {
            const container = document.getElementById('estatesList');
            container.innerHTML = estates.map(estate => `
                <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm cursor-pointer hover:border-brand-gold transition-all" onclick="openEstate('${estate.id}', '${estate.name}')">
                    <h3 class="font-bold text-lg text-brand-primary">${estate.name}</h3>
                    <p class="text-sm text-gray-500 mb-2">Seller: ${estate.seller_name || 'N/A'}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs bg-brand-bg text-brand-primary px-3 py-1 rounded-full font-semibold border">${estate.sale_date}</span>
                        <span class="text-brand-gold font-semibold text-sm">Open Sourcing View →</span>
                    </div>
                </div>
            `).join('');
        }

        async function openEstate(id, name) {
            currentEstateId = id;
            document.getElementById('salesView').classList.add('hidden');
            document.getElementById('lotView').classList.remove('hidden');
            document.getElementById('saleHeader').innerHTML = `
                <h2 class="text-2xl font-bold tracking-tight text-brand-primary">${name}</h2>
                <p class="text-xs text-brand-gold uppercase tracking-wider font-bold">Research & Field View</p>
            `;
            await loadLots(id);
        }

        function showSalesView() {
            document.getElementById('salesView').classList.remove('hidden');
            document.getElementById('lotView').classList.add('hidden');
            currentEstateId = null;
        }

        // Modal Helpers
        function showCreateSaleModal() { document.getElementById('createSaleModal').classList.remove('hidden'); }
        function hideCreateSaleModal() { document.getElementById('createSaleModal').classList.add('hidden'); }

        async function createEstate() {
            const name = document.getElementById('estateName').value;
            const seller = document.getElementById('estateSeller').value;
            const date = document.getElementById('estateDate').value;

            if(!name || !date) return alert("Please fill out Name and Date fields.");

            const { data, error } = await supabase
                .from('estates')
                .insert([{ name, seller_name: seller, sale_date: date }])
                .select();

            if (!error) {
                hideCreateSaleModal();
                await fetchEstates();
            } else {
                alert("Database write error: " + error.message);
            }
        }

        // Supabase Image Storage Upload & Reference Logic
        function handleImageSelection(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('uploadLabel').innerText = `Selected: ${selectedFile.name} (Ready to Save)`;
            }
        }

        async function createLot() {
            const title = document.getElementById('newLotTitle').value;
            if (!title) return alert("Please specify a lot title.");

            let imageUrl = null;

            if (selectedFile) {
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${currentEstateId}-${Date.now()}.${fileExt}`;
                const filePath = `lots/${fileName}`;

                // Upload Base64 raw binaries to Public Supabase S3 storage container
                const { error: uploadError } = await supabase.storage
                    .from('lot-screenshots')
                    .upload(filePath, selectedFile);

                if (uploadError) {
                    return alert("Storage Error: " + uploadError.message);
                }

                // Get Public Url Link reference
                const { data } = supabase.storage
                    .from('lot-screenshots')
                    .getPublicUrl(filePath);

                imageUrl = data.publicUrl;
            }

            // Insert matching pointer reference directly into Tablelots postgres table
            const { error: lotError } = await supabase
                .from('lots')
                .insert([{ estate_id: currentEstateId, title: title, image_url: imageUrl }]);

            if (!lotError) {
                document.getElementById('newLotTitle').value = '';
                document.getElementById('uploadLabel').innerText = '📷 UPLOAD REFERENCE SCREENSHOT';
                selectedFile = null;
                await loadLots(currentEstateId);
            } else {
                alert("Database Error: " + lotError.message);
            }
        }

         // Heavy DB Aggregator and Dynamic Mobile Responsive Card Renderer
        async function loadLots(estateId) {
            const { data: lots, error: lotErr } = await supabase
                .from('lots')
                .select('*')
                .eq('estate_id', estateId);

            if (lotErr) return console.error(lotErr);

            const container = document.getElementById('lotsList');
            if (lots.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center italic py-10 bg-white rounded-lg border border-dashed border-gray-300">No lots loaded yet. Paste screenshots above to begin research!</p>`;
                return;
            }

            let lotsHTML = '';

            for (const lot of lots) {
                const { data: items, error: itemErr } = await supabase
                    .from('items')
                    .select('*')
                    .eq('lot_id', lot.id)
                    .order('created_at', { ascending: true });

                let itemsListHTML = '';
                if (items && items.length > 0) {
                    itemsListHTML = items.map(item => {
                        // Check if this item is currently collapsed
                        const isCollapsed = collapsedNotesState[item.id] !== false;
                        const displayClass = isCollapsed ? 'hidden' : 'block';
                        const buttonText = isCollapsed ? '👁️ Show' : '🙈 Hide';
                        
                        return `
                        <!-- Item Card -->
                        <div class="border-b last:border-b-0 pb-6 mb-6 last:mb-0 last:pb-0" id="item-card-${item.id}">
                            <!-- 1. FULL WIDTH TITLE HEADER -->
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                                <div class="flex items-center gap-2 flex-wrap min-w-0">
                                    <h5 class="font-bold text-brand-primary text-base sm:text-lg leading-tight min-w-0 break-words">${item.name}</h5>
                                    ${item.ai_model ? `<span class="text-[10px] bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full font-sans font-semibold border shrink-0">🤖 ${item.ai_model}</span>` : ''}
                                </div>
                                <!-- Top Right Target Badge -->
                                <div class="flex items-center gap-1.5 font-bold text-brand-gold bg-brand-bg border border-amber-200/50 px-3.5 py-1.5 rounded-full text-xs sm:text-sm shadow-sm shrink-0 self-start sm:self-auto">
                                    <span>Target:</span> <span class="text-brand-primary">${item.buy || '$0'}</span>
                                </div>
                            </div>

                            <!-- 2. METADATA ROW & TOGGLES (Always Visible) -->
                            <div class="flex flex-wrap items-center justify-between gap-3 bg-gray-50/50 p-2.5 rounded-lg border border-gray-100 mb-4">
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleNotes('${item.id}')" id="toggle-btn-${item.id}" class="text-xs text-brand-gold hover:text-brand-primary font-bold flex items-center gap-1.5 bg-white border border-amber-200/60 px-3 py-1.5 rounded-md shadow-sm transition-all">
                                        ${buttonText} Checklist
                                    </button>
                                    <button onclick="deleteItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')" class="text-xs text-red-600 hover:bg-red-50 hover:text-red-800 font-bold flex items-center gap-1.5 bg-white border border-red-200/40 px-3 py-1.5 rounded-md shadow-sm transition-all">
                                        🗑️ Delete
                                    </button>
                                </div>
                                <!-- Always Visible Est Resale & Confidence -->
                                <div class="text-xs text-gray-500 font-sans flex items-center gap-2">
                                    <span>Est Resale: <strong class="text-brand-primary font-bold">${item.resale_estimate || 'N/A'}</strong></span>
                                    <span class="text-gray-300">|</span>
                                    <span>Confidence: <strong class="text-brand-primary font-bold">${item.confidence || '55'}%</strong></span>
                                </div>
                            </div>

                            <!-- 3. DETAILED ACTION & INPUTS AREA -->
                            <!-- Mobile Inputs and Actions Stacking (Visible on Phone only, hidden on Tablet/Desktop) -->
                            <div class="sm:hidden space-y-3 mb-4">
                                <div class="flex items-center gap-2 bg-emerald-50/50 border border-emerald-100 p-2.5 rounded-lg">
                                    <button onclick="oneTapPay('${item.id}', '${item.buy}')" class="flex-1 flex items-center justify-center gap-1 bg-emerald-600 text-white font-bold py-2 rounded-md hover:bg-emerald-700 transition-all text-xs">
                                        ✅ Buy at Target
                                    </button>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <span class="text-xs text-emerald-800 font-bold uppercase">Paid:</span>
                                        <input type="text" id="paid-mobile-${item.id}" value="${item.paid || '0.00'}" onchange="updateField('${item.id}', 'paid', this.value)" class="border border-emerald-200 p-1.5 rounded-md w-24 text-center font-bold text-emerald-700 bg-white text-xs">
                                    </div>
                                </div>
                            </div>

                            <!-- Desktop/Tablet Metrics Inputs & Actions Row (Visible on iPad and MacBook) -->
                            <div class="hidden sm:grid grid-cols-1 sm:grid-cols-4 gap-4 items-end border-b border-dashed border-gray-100 pb-4 mb-4">
                                <div>
                                    <span class="block text-gray-400 uppercase font-bold text-[10px] mb-1">Day 1 Target:</span> 
                                    <input type="text" value="${item.buy || ''}" onchange="updateField('${item.id}', 'buy', this.value)" class="border p-2 rounded-md w-full bg-brand-bg text-brand-primary font-semibold text-center focus:ring-1 focus:ring-brand-gold">
                                </div>
                                <div>
                                    <span class="block text-gray-400 uppercase font-bold text-[10px] mb-1">Resale Est:</span> 
                                    <input type="text" value="${item.resale_estimate || ''}" onchange="updateField('${item.id}', 'resale_estimate', this.value)" class="border p-2 rounded-md w-full text-brand-primary font-semibold text-center focus:ring-1 focus:ring-brand-gold">
                                </div>
                                <div>
                                    <span class="block text-gray-400 uppercase font-bold text-[10px] mb-1">Confidence %:</span> 
                                    <input type="number" value="${item.confidence || ''}" onchange="updateField('${item.id}', 'confidence', this.value)" class="border p-2 rounded-md w-full text-brand-primary text-center focus:ring-1 focus:ring-brand-gold">
                                </div>
                                <div class="flex items-center gap-2 justify-end">
                                    <button onclick="oneTapPay('${item.id}', '${item.buy}')" class="flex items-center gap-1 bg-emerald-50 text-emerald-800 border border-emerald-300 font-bold px-3 py-2.5 rounded-md hover:bg-emerald-100 transition-all text-xs shrink-0" title="Tap if you paid target price!">
                                        ✅ Buy at Target
                                    </button>
                                    <div class="flex flex-col shrink-0">
                                        <span class="text-[9px] text-gray-400 uppercase font-bold mb-1">Paid:</span>
                                        <input type="text" id="paid-desktop-${item.id}" value="${item.paid || '0.00'}" onchange="updateField('${item.id}', 'paid', this.value)" class="border p-2 rounded-md w-24 text-center font-bold text-emerald-700 bg-white text-xs">
                                    </div>
                                </div>
                            </div>

                            <!-- 4. UNIFIED DYNAMIC NOTES CONTAINER -->
                            <div id="notes-container-${item.id}" class="${displayClass} mt-3">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <!-- Column 1: Edit Notes Textarea (Visible on Tablet/Desktop, hidden on Phone) -->
                                    <div class="hidden sm:block">
                                        <span class="block text-gray-400 uppercase font-bold text-[10px] mb-1">Edit Notes:</span>
                                        <textarea onchange="updateField('${item.id}', 'notes', this.value)" class="border p-2 rounded-md w-full text-brand-primary focus:ring-1 focus:ring-brand-gold h-28 resize-y" placeholder="Enter detailed inspection notes here...">${item.notes || ''}</textarea>
                                    </div>
                                    
                                    <!-- Column 2 / Mobile View: Single Checklist Container (Adapts title responsively) -->
                                    <div class="bg-amber-50/20 border border-amber-100 rounded-md p-3">
                                        <span class="block text-amber-800 uppercase font-bold text-[10px] mb-1 hidden sm:block">Checklist Live Preview:</span>
                                        <span class="block text-amber-800 uppercase font-bold text-[10px] mb-1 sm:hidden">Field Checklist:</span>
                                        ${renderChecklist(item.notes)}
                                    </div>
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('');
                } else {
                    itemsListHTML = `<p class="text-xs text-gray-400 italic py-2">No items processed yet. Click 'Paste From Chat' below and drop Claude's analysis!</p>`;
                }

                lotsHTML += `
                    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
                        <!-- Lot reference Image Panel -->
                        ${lot.image_url ? `
                            <div class="w-full bg-black max-h-96 flex items-center justify-center overflow-hidden">
                                <img src="${lot.image_url}" class="max-h-96 object-contain w-full" alt="${lot.title}">
                            </div>
                        ` : ''}

                        <div class="p-6">
                            <h4 class="text-lg font-bold text-brand-primary border-b pb-2 mb-4">${lot.title}</h4>
                            
                            <!-- Items List -->
                            <div class="space-y-4">
                                ${itemsListHTML}
                            </div>

                            <!-- Paste From Chat UI trigger -->
                            <div class="mt-6 flex flex-wrap gap-2 border-t pt-4">
                                <button onclick="triggerPaste('${lot.id}')" class="bg-amber-50 text-amber-800 border border-amber-300 font-bold px-4 py-2 rounded-md hover:bg-amber-100 transition-all text-xs">
                                    📋 PASTE FROM CHAT (JSON)
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = lotsHTML;
        }


        // Inline Field Editor updates DB instantly
        async function updateField(id, field, value) {
            const updateObj = {};
            updateObj[field] = value;
            const { error } = await supabase
                .from('items')
                .update(updateObj)
                .eq('id', id);

            if (error) console.error(error);
        }

     // Quick one-tap checkout syncing both layout modes
        async function oneTapPay(itemId, buyPrice) {
            // Strip dollar signs and formatting
            const parsedPrice = buyPrice ? buyPrice.replace(/[^0-9.]/g, '') : "0.00";
            
            // Instantly sync visual fields
            const mobileInput = document.getElementById(`paid-mobile-${itemId}`);
            const desktopInput = document.getElementById(`paid-desktop-${itemId}`);
            
            if (mobileInput) mobileInput.value = parsedPrice;
            if (desktopInput) desktopInput.value = parsedPrice;

            // Direct cloud save
            await updateField(itemId, 'paid', parsedPrice);
        }

// Toggle notes open or collapsed dynamically
        function toggleNotes(itemId) {
            // Flip the collapsed state
            const currentState = collapsedNotesState[itemId] !== false;
            collapsedNotesState[itemId] = !currentState;
            
            const notesContainer = document.getElementById(`notes-container-${itemId}`);
            const btn = document.getElementById(`toggle-btn-${itemId}`);
            
            if (collapsedNotesState[itemId]) {
                if (notesContainer) {
                    notesContainer.classList.add('hidden');
                }
                if (btn) btn.innerHTML = '👁️ Show Checklist';
            } else {
                if (notesContainer) {
                    notesContainer.classList.remove('hidden');
                }
                if (btn) btn.innerHTML = '🙈 Hide Checklist';
            }
        }

        // Delete an item from Supabase with instant UI sync
        async function deleteItem(itemId, itemName) {
            // Native mobile safety confirmation prompt
            if (!confirm(`Are you sure you want to delete "${itemName}"?`)) {
                return;
            }

            try {
                const { error } = await supabase
                    .from('items')
                    .delete()
                    .eq('id', itemId);

                if (!error) {
                    // Instantly reload lots to update UI
                    await loadLots(currentEstateId);
                } else {
                    alert("Delete failed: " + error.message);
                }
            } catch (err) {
                console.error("Error deleting item:", err);
                alert("An unexpected error occurred while deleting.");
            }
        }
    // Dynamically parses a block of text into interactive checkboxes
        function renderChecklist(notes) {
            if (!notes) return '<p class="text-xs text-gray-400 italic">No checklist notes added.</p>';
            
            // Split notes by line breaks, bullets, standard sentence periods, or numbered list markers (e.g. 1. or 2))
            const steps = notes.split(/\n|•|■|(?<=\w\w)\.\s+|\b\d+[\.)]\s+/).map(step => step.trim()).filter(step => step.length > 0);
            
            if (steps.length === 0) return '<p class="text-xs text-gray-400 italic">No checklist notes added.</p>';
            
            return `
            <div class="space-y-1.5 mt-2">
                ${steps.map((step, idx) => `
                    <label class="flex items-start gap-2.5 py-1 px-1.5 rounded hover:bg-amber-50/40 transition-colors cursor-pointer group">
                        <input type="checkbox" class="mt-0.5 h-4 w-4 rounded border-amber-300 text-brand-gold focus:ring-brand-gold accent-amber-600 cursor-pointer" onchange="this.nextElementSibling.classList.toggle('line-through', this.checked); this.nextElementSibling.classList.toggle('text-gray-400', this.checked); this.nextElementSibling.classList.toggle('italic', this.checked)">
                        <span class="text-sm text-gray-700 font-mono transition-all group-hover:text-black leading-tight">${step}</span>
                    </label>
                `).join('')}
            </div>
            `;
        }     // Robust JSON Clipboard Parser: Turns Claude's unstructured prompt data into aligned Postgres rows
        async function triggerPaste(lotId) {
            try {
                const text = await navigator.clipboard.readText();
                const parsedData = JSON.parse(text);

                // Normalizes JSON structure if wrapped in a master object
                const itemsArray = Array.isArray(parsedData) ? parsedData : (parsedData.items || []);

                if (!Array.isArray(itemsArray) || itemsArray.length === 0) {
                    return alert("Data format error: Make sure you copied Claude's raw JSON array.");
                }

               // Push all rows directly to database via Supabase
                const rowsToInsert = itemsArray.map(item => ({
                    lot_id: lotId,
                    name: item.name || item.title || "Unknown Item",
                    flag: item.flag || "day1",
                    buy: item.buy || item.day_1_offer || "$0",
                    resale_estimate: item.resale_estimate || "$0",
                    confidence: parseInt(item.confidence) || 55,
                    sell_speed: item.sell_speed || "Slow",
                    notes: item.notes || "",
                    ai_model: item.ai_model || "Unknown AI" // <-- ADD THIS LINE
                }));

                const { error } = await supabase
                    .from('items')
                    .insert(rowsToInsert);

                if (!error) {
                    await loadLots(currentEstateId);
                } else {
                    alert("Write failed: " + error.message);
                }

            } catch (err) {
                alert("Clipboard Error: Could not read text or JSON is invalid. See guide Phase 5 for standard pasting rules!");
            }
        }
    </script>
